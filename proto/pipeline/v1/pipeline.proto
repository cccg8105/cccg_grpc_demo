syntax = "proto3";

package pipeline.v1;

option py_generic_services = false;

service IngestService {
  rpc RunPipeline(StartPipelineRequest) returns (stream ProgressEvent);
  rpc Ping(PingRequest) returns (PingResponse);
}

service TransformService {
  rpc TransformStream(stream RecordBatch) returns (stream BatchResult);
  rpc Ping(PingRequest) returns (PingResponse);
}

message StartPipelineRequest {
  string job_id = 1;
  string file_path = 2;
  int32 chunk_size = 3;
  int32 sleep_ms = 4;
}

message TransactionRecord {
  string id = 1;
  double amount = 2;
  string currency = 3;
  string merchant = 4;
  string timestamp = 5;
}

message RecordBatch {
  string job_id = 1;
  int32 chunk_index = 2;
  int32 chunk_total = 3;
  int32 chunk_size = 4;
  int64 bytes_read = 6;
  int32 total_rows_estimate = 7;
  int64 total_file_bytes = 8;
  int32 line_number_end = 9;
  repeated TransactionRecord records = 10;
}

message BatchResult {
  int32 rows_processed = 1;
  int32 rows_rejected = 2;
  double total_usd_delta = 3;
  string record_preview = 4;
}

message ProgressEvent {
  string job_id = 1;
  string stage = 2;
  int64 timestamp_ms = 3;
  string record_preview = 4;
  int32 rows_processed = 5;
  int32 rows_rejected = 6;
  double total_usd = 7;
  int32 total_rows_estimate = 8;
  double throughput_rows_per_sec = 9;
  bool job_complete = 10;
  string message = 11;
  int64 bytes_streamed = 12;
  int64 total_file_bytes = 13;
  double throughput_bytes_per_sec = 14;
  int32 chunk_index = 15;
  int32 chunk_total = 16;
  int64 wire_bytes_total = 17;
  int32 wire_bytes_batch = 18;
}

message PingRequest {}

message PingResponse {
  string status = 1;
}
