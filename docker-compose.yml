services:
  ingest-service:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    container_name: rpc-demo-ingest
    environment:
      INGEST_PORT: "50051"
      TRANSFORM_TARGET: transform-service:50052
      PROGRESS_EVERY: "50"
    volumes:
      - ./data:/data:ro
    networks:
      - grpc-net
    depends_on:
      transform-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from generated.pipeline.v1 import pipeline_pb2, pipeline_pb2_grpc; ch=grpc.insecure_channel('localhost:50051'); stub=pipeline_pb2_grpc.IngestServiceStub(ch); print(stub.Ping(pipeline_pb2.PingRequest()).status)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  transform-service:
    build:
      context: .
      dockerfile: services/transform/Dockerfile
    container_name: rpc-demo-transform
    environment:
      TRANSFORM_PORT: "50052"
      GATEWAY_TARGET: gateway:50053
      PROGRESS_EVERY: "50"
    networks:
      - grpc-net
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from generated.pipeline.v1 import pipeline_pb2, pipeline_pb2_grpc; ch=grpc.insecure_channel('localhost:50052'); stub=pipeline_pb2_grpc.TransformServiceStub(ch); print(stub.Ping(pipeline_pb2.PingRequest()).status)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: rpc-demo-gateway
    environment:
      HTTP_PORT: "8080"
      GRPC_PORT: "50053"
      INGEST_TARGET: ingest-service:50051
      DEFAULT_FILE: /data/transactions.csv
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpc-demo-frontend
    environment:
      VITE_GATEWAY_URL: http://localhost:8080
      VITE_REST_INGEST_URL: http://localhost:8091
      VITE_REST_TRANSFORM_URL: http://localhost:8092
    ports:
      - "5173:5173"
    networks:
      - grpc-net
    depends_on:
      gateway:
        condition: service_healthy
      rest-ingest:
        condition: service_healthy
      rest-transform:
        condition: service_healthy

  rest-ingest:
    build:
      context: .
      dockerfile: services/rest_ingest/Dockerfile
    container_name: rpc-demo-rest-ingest
    environment:
      HTTP_PORT: "8091"
      DEFAULT_FILE: /data/transactions.csv
    ports:
      - "8091:8091"
    volumes:
      - ./data:/data:ro
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rest-transform:
    build:
      context: .
      dockerfile: services/rest_transform/Dockerfile
    container_name: rpc-demo-rest-transform
    environment:
      HTTP_PORT: "8092"
    ports:
      - "8092:8092"
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  grpc-net:
    driver: bridge
